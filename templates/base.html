<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Campus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename=css_file or 'login.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <div class="navbar">
        <div class="logo">Job Campus</div>

        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('upload') }}">Upload</a>
            <a href="{{ url_for('recommendations') }}">Recommendations</a>
        </div>

        <div class="nav-actions">
            <a href="{{ url_for('login') }}">
                <button>Login</button>
            </a>

            <!--  Added: Sign Up -->
            <a href="{{ url_for('register') }}">
                <button>Sign Up</button>
            </a>

            <!-- Added: Logout -->
            <a href="{{ url_for('logout') }}">
                <button>Logout</button>
            </a>

        </div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flash-container">
        {% for category, msg in messages %}
        <div class="flash flash-{{ category }}">{{ msg }}</div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}
    <script>
        // auto hide flash messages after 1.5 seconds
        setTimeout(function () {
            let flashes = document.querySelectorAll('.flash');
            flashes.forEach(flash => {
                flash.style.transition = "opacity 0.5s ease";
                flash.style.opacity = "0";
                setTimeout(() => flash.remove(), 500);
            });
        }, 1500); 
    </script>

    {% block content %}
    {% endblock %}

</body>

</html>
